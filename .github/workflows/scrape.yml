name: Scrape CME Gold Options

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Запрещаем параллельные выполнения, чтобы избежать конфликтов git push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push data.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Подтягиваем изменения из удалённого репозитория, если есть
          git pull --rebase origin main
          git add data.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data [skip ci]"
            git push
          fi
